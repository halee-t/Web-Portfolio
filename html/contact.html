<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/contact.css" />
    <script
      src="https://kit.fontawesome.com/a075807fa0.js"
      crossorigin="anonymous"
    ></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
    </style>
    <title>Halee Tisler - Say Hi :)</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <div id="logo-img" class="fa fa-code"></div>
        <h1>Halee Tisler</h1>
      </div>
      <nav id="navbar">
        <ul>
          <li><a class="nav-link" href="../index.html">Home</a></li>
          <li><a class="nav-link" href="./about.html">About</a></li>
          <li><a class="nav-link" href="./projects.html">Projects</a></li>
          <li>
            <a class="nav-link" id="selected-tab" href="./contact.html"
              >Contact</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <section id="contact">
      <h1>
        <div class="fa-regular fa-message"></div>
        Let's Keep In Touch
        <div class="fa-regular fa-message"></div>
      </h1>
      <p class="contact-subtitle">
        If you would like to know more about me or my work, send me a message!
        You may also email me directly.
      </p>
      <div class="bubble">
        <form action="mailto:haleetisler@gmail.com" class="form contact-form">
          <div class="contact-first-row">
            <div class="fname-section">
              <label class="contact-label" for="fname">First Name</label>
              <input
                class="contact-input"
                type="text"
                id="fname"
                name="firstName"
                placeholder="First name ..."
              />
            </div>
            <div class="lname-section">
              <label class="contact-label" for="lname">Last Name</label>
              <input
                class="contact-input"
                type="text"
                id="lname"
                name="lastName"
                placeholder="Last name ..."
              />
            </div>
          </div>
          <br />
          <label class="contact-label" for="email">Email</label>
          <input
            class="contact-input"
            type="email"
            id="email"
            name="emailAddress"
            placeholder="youremail@gmail.com"
          />
          <br />
          <label class="contact-label" for="message">Message</label>
          <textarea
            class="contact-input"
            id="message"
            name="message"
            placeholder="What would you like to tell me?"
          >
          </textarea>
          <br />
          <input class="submit" type="submit" value="Send It!" />
        </form>
      </div>
    </section>
  </body>
</html>
